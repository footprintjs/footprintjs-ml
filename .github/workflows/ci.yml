name: Beta CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: Node ${{ matrix.node }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDK development dependencies
        run: npm ci
      - name: Install reference trainer dependencies
        run: python -m pip install -r examples/quickstart/requirements.txt
      - name: Build SDK
        run: npm run build
      - name: Check agent skill, feature routing and guide links
        run: npm run check:agent-docs
      - name: Test SDK contracts
        run: npm test
      - name: Test Python adapter boundaries
        run: python -m unittest discover -s python/tests -v
      - name: Test the reference trainer
        run: python -m unittest discover -s examples/quickstart -p 'test_*.py' -v
      - name: Verify the beta from a fresh package installation
        run: npm run beta:smoke
      - name: Install Python build tools (not SDK runtime dependencies)
        run: python -m pip install 'setuptools>=77.0.3' wheel
      - name: Build the same SDK as a Python wheel
        run: npm run build:python
      - name: Pack the matching native helper
        run: |
          mkdir -p .artifacts/npm
          npm pack --pack-destination .artifacts/npm
      - name: Verify Python installation outside the checkout
        run: python scripts/python-install-smoke.py --wheel python-dist/*.whl --archive .artifacts/npm/*.tgz

  optional-mlflow:
    name: Optional Python MLflow integration
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_TELEMETRY: 'true'
      MLFLOW_DISABLE_AGENT_HINT: 'true'
      DO_NOT_TRACK: 'true'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Verify optional integrations import without Python ML packages
        run: node scripts/check-optional-dependencies.mjs
      - name: Install only this example's optional Python dependencies
        run: python -m pip install -r examples/mlflow/requirements.txt
      - name: Run the Python-orchestrated MLflow proof
        run: python examples/mlflow/run.py --out .artifacts/mlflow-proof
      - name: Reopen saved evidence with trainer spawning forbidden
        run: node --permission --allow-fs-read=. --allow-fs-write=.artifacts/mlflow-proof examples/mlflow/investigate.mjs --run .artifacts/mlflow-proof
      - name: Independently audit the saved numerical predictions
        run: python -I -S examples/mlflow/audit.py --run .artifacts/mlflow-proof
      - name: Exercise the persistent inference cache and ordered contract
        run: python examples/inference/run.py --out .artifacts/inference-proof
      - name: Investigate saved inference evidence with backend spawning forbidden
        run: node --permission --allow-fs-read=. --allow-fs-write=.artifacts/inference-proof examples/inference/investigate.mjs --run .artifacts/inference-proof
      - name: Independently audit inference labels without numerical packages
        run: python -I -S examples/inference/audit.py --run .artifacts/inference-proof
      - name: Run inference through FootPrint decisions and native retry
        run: node examples/inference/native-run.mjs --out .artifacts/native-inference-proof --python python
      - name: Reopen the executor proof without backend or process access
        run: node --permission --allow-fs-read=node_modules --allow-fs-read=examples/inference --allow-fs-read=package.json --allow-fs-read=lens --allow-fs-read=.artifacts/native-inference-proof/recording.json --allow-fs-read=.artifacts/native-inference-proof/outcome.json --allow-fs-write=.artifacts/native-inference-proof/native-investigation.json examples/inference/native-investigate.mjs --run .artifacts/native-inference-proof
      - name: Independently audit native-workflow prediction labels
        run: python -I -S examples/inference/audit.py --run .artifacts/native-inference-proof

      - name: Exercise checked Python promotion against a real local MLflow registry
        run: python examples/mlflow-promotion/run.py --out .artifacts/mlflow-promotion-proof
      - name: Investigate saved promotion with backend processes forbidden
        run: node --permission --allow-fs-read=. --allow-fs-write=.artifacts/mlflow-promotion-proof examples/mlflow-promotion/investigate.mjs --run .artifacts/mlflow-promotion-proof
      - name: Audit saved promotion arithmetic and journal evidence using stdlib only
        run: python -I -S examples/mlflow-promotion/verify.py --run .artifacts/mlflow-promotion-proof
