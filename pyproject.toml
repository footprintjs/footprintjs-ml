[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "footprintjs-ml"
version = "0.6.0b12"
description = "Python workflow capture and ML evidence bindings over the FootPrint runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["machine-learning", "provenance", "workflow", "footprintjs", "mlflow"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://footprintjs.github.io/footprintjs-ml/"
Repository = "https://github.com/footprintjs/footprintjs-ml"
Issues = "https://github.com/footprintjs/footprintjs-ml/issues"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["footprint_ml_workflow", "footprint_ml_setup", "footprint_ml_versions", "footprint_ml_promotion"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["footprint_ml_adapter*"]
namespaces = false

# Read-only agent guidance and inspectable examples; native helper remains explicit.
[tool.setuptools.data-files]
"share/footprintjs-ml" = ["*.md", "LICENSE"]
"share/footprintjs-ml/python" = ["python/README.md", "python/*.py"]
"share/footprintjs-ml/features" = ["features/README.md"]
"share/footprintjs-ml/skills/footprintjs-ml" = ["skills/footprintjs-ml/SKILL.md"]
"share/footprintjs-ml/skills/footprintjs-ml/agents" = ["skills/footprintjs-ml/agents/openai.yaml"]
"share/footprintjs-ml/lens" = ["lens/session.d.ts", "lens/session.mjs"]
"share/footprintjs-ml/features/references" = ["features/references/README.md"]
"share/footprintjs-ml/features/evaluation" = ["features/evaluation/README.md"]
"share/footprintjs-ml/features/trainer-adapter" = ["features/trainer-adapter/README.md"]
"share/footprintjs-ml/features/approval" = ["features/approval/README.md"]
"share/footprintjs-ml/features/investigation" = ["features/investigation/README.md"]
"share/footprintjs-ml/features/data-lineage" = ["features/data-lineage/README.md"]
"share/footprintjs-ml/features/selection" = ["features/selection/README.md"]
"share/footprintjs-ml/features/publication" = ["features/publication/README.md"]
"share/footprintjs-ml/src" = ["src/*.ts"]
"share/footprintjs-ml/src/adapter" = ["src/adapter/*.ts"]
"share/footprintjs-ml/src/conformance" = ["src/conformance/*.ts"]
"share/footprintjs-ml/src/release" = ["src/release/*.ts"]
"share/footprintjs-ml/examples/quickstart" = ["examples/quickstart/*.py", "examples/quickstart/*.mjs", "examples/quickstart/*.md", "examples/quickstart/*.txt"]
"share/footprintjs-ml/examples/mlflow" = ["examples/mlflow/*.py", "examples/mlflow/*.mjs", "examples/mlflow/*.md", "examples/mlflow/*.txt"]
"share/footprintjs-ml/examples/python-adoption" = ["examples/python-adoption/*.py", "examples/python-adoption/*.md"]
"share/footprintjs-ml/examples/selection-backtracking" = ["examples/selection-backtracking/*.mjs", "examples/selection-backtracking/*.md"]
"share/footprintjs-ml/python/footprint_ml_adapter" = ["python/footprint_ml_adapter/*.py"]
"share/footprintjs-ml/examples/python-guards" = ["examples/python-guards/*.py", "examples/python-guards/*.mjs", "examples/python-guards/*.json", "examples/python-guards/*.md"]
"share/footprintjs-ml/examples/python-guards/evidence" = ["examples/python-guards/evidence/*.json"]
"share/footprintjs-ml/features/inference" = ["features/inference/README.md"]
"share/footprintjs-ml/examples/inference" = ["examples/inference/*.py", "examples/inference/*.mjs", "examples/inference/*.json", "examples/inference/*.md", "examples/inference/*.txt"]
"share/footprintjs-ml/examples/inference/fixtures" = ["examples/inference/fixtures/*.json"]

"share/footprintjs-ml/examples/mlflow-promotion" = ["examples/mlflow-promotion/*.py", "examples/mlflow-promotion/*.mjs", "examples/mlflow-promotion/*.md", "examples/mlflow-promotion/*.txt"]

"share/footprintjs-ml/features/regression" = ["features/regression/README.md"]
"share/footprintjs-ml/examples/regression" = ["examples/regression/*.py", "examples/regression/*.mjs", "examples/regression/*.md", "examples/regression/*.txt"]

"share/footprintjs-ml/features/monitoring" = ["features/monitoring/README.md"]
"share/footprintjs-ml/examples/monitoring" = ["examples/monitoring/*.py", "examples/monitoring/*.mjs", "examples/monitoring/*.md", "examples/monitoring/*.txt"]
